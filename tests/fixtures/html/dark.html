<h1>โปรโมชันพิเศษสำหรับสมาชิก</h1>
<p>ลดราคาสินค้าทุกรายการ ๒๐ เปอร์เซ็นต์ ตั้งแต่วันนี้จนถึงสิ้นเดือน</p>
<p><span class="hl">สมัครสมาชิกฟรี รับคูปองส่วนลดทันที</span></p>
<p>เงื่อนไขเป็นไปตามที่บริษัทกำหนด สอบถามรายละเอียดเพิ่มเติมได้ที่สาขาใกล้บ้าน</p>
