name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Engine parity against the Python reference goldens (downloads the pinned models first).
      - run: npm test
      - run: npm run build
      - name: Browser tests (dev server)
        run: |
          npx playwright install --with-deps chromium
          PW_CHANNEL=chromium npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: thaiocr-web:ci
