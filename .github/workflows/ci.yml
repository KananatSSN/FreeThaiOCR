name: CI
# Actions are pinned to commit SHAs (tags can be moved); the comment names the version.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # ARM, like the machine the parity goldens are generated on: ONNX Runtime's ARM and x86 CPU
    # kernels round differently, which flips a few unstable readings on the table fixtures.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Engine parity against the Python reference goldens (downloads the pinned models first).
      - run: npm test
      - run: npm run build
      - name: Browser tests (dev server)
        run: |
          npx playwright install --with-deps chromium
          PW_CHANNEL=chromium npm run test:e2e

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          tags: freethaiocr-web:ci
