# ThaiOCR behind a Cloudflare Tunnel. Copy .env.example to .env, set TUNNEL_TOKEN, then:
#   docker compose up -d --build
# In the Cloudflare dashboard, point the tunnel's public hostname at http://web:8080
services:
  web:
    build:
      context: .
      args:
        VITE_PROMPTPAY_ID: ${VITE_PROMPTPAY_ID:-}
        VITE_DONATE_URL: ${VITE_DONATE_URL:-}
        VITE_REPO_URL: ${VITE_REPO_URL:-}
    image: thaiocr-web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    # Only on localhost, for checking the site before (or without) the tunnel.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

  cloudflared:
    image: cloudflare/cloudflared:latest # pin a version (e.g. cloudflare/cloudflared:2026.x.y) for reproducible deploys
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-} # from .env; see README "Cloudflare Tunnel"
    depends_on:
      web:
        condition: service_healthy
