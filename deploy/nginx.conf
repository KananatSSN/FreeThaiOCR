# FreeThaiOCR static site. All OCR runs in the browser; this server only serves files.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Privacy: no access log, so the server keeps no record of visitors' IP
    # addresses or what they open (see the privacy policy in the app).
    # Errors are still logged, without request details beyond the error itself.
    access_log off;
    error_log /dev/stderr warn;

    # Requests arrive from the cloudflared container over the Docker network;
    # log the visitor IP Cloudflare forwards rather than the container's.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;

    gzip on;
    gzip_static on;        # serve the .gz files Vite pre-compressed
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json application/wasm image/svg+xml text/plain;

    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
        application/wasm wasm;
        application/octet-stream onnx;
        application/manifest+json webmanifest;
        text/yaml yml;
    }

    # Cross-origin isolation: required for multi-threaded WASM (SharedArrayBuffer).
    # Everything the page loads is same-origin, so require-corp costs nothing.
    set $isolation_coop "same-origin";
    set $isolation_coep "require-corp";
    # 'wasm-unsafe-eval' lets ONNX Runtime and OpenCV compile WebAssembly.
    # No third-party origins are allowed at all.
    set $csp "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'";

    # The OCR worker runs OpenCV.js, whose embind bindings build functions with
    # `new Function`. A worker's CSP comes from its own script response, so only
    # the worker gets 'unsafe-eval'; the page itself stays strict.
    set $csp_worker "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' data: blob:; object-src 'none'; base-uri 'self'";

    add_header Cross-Origin-Opener-Policy $isolation_coop always;
    add_header Cross-Origin-Embedder-Policy $isolation_coep always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;

    location ~ ^/assets/worker-[A-Za-z0-9_-]+\.js$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Embedder-Policy $isolation_coep always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy $csp_worker always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Content-hashed bundles and versioned model/vendor paths never change.
    # Long cache lets Cloudflare's edge serve them so the origin sees almost no traffic.
    location ~ ^/(assets|models|vendor|donate)/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy $isolation_coop always;
        add_header Cross-Origin-Embedder-Policy $isolation_coep always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
    }

    # The app shell and service worker must revalidate so updates roll out.
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|theme-init\.js)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy $isolation_coop always;
        add_header Cross-Origin-Embedder-Policy $isolation_coep always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy $isolation_coop always;
        add_header Cross-Origin-Embedder-Policy $isolation_coep always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
